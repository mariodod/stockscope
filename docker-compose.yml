services:
  db:
    image: postgres:16-alpine
    container_name: stockscope-db
    environment:
      POSTGRES_USER: stockscope
      POSTGRES_PASSWORD: stockscope
      POSTGRES_DB: stockscope
    ports:
      - "5432:5432"
    volumes:
      - stockscope-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockscope -d stockscope"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stockscope-db-data:
