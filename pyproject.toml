[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockscope"
version = "0.1.0"
description = "Stock screening and analysis for publicly listed companies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
  "apscheduler>=3.10",
  "yfinance>=0.2",
]

[project.optional-dependencies]
cache = ["redis>=5"]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.seed" = ["metrics_catalog.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^alembic/"]
[[tool.mypy.overrides]]
module = ["psycopg.*", "yfinance.*", "apscheduler.*", "redis.*"]
ignore_missing_imports = true
